<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container my-5">
        <h1 id="heading">ADD TODO</h1>
        <form id="todolistform" action="" class="my-5 border rounded p-5 w-75">
            <div class="mb-3">
                <input id="titleinput" type="text" placeholder="title" class="form-control">
            </div>
             <div class="mb-3">
                <input id="dateinput" type="date" placeholder="date" class="form-control">
            </div>
            <div class="mb-3">
                Status:
                <label for="completed">Completed</label>
                <input type="checkbox" id="completed">
            </div>
            <div class="mb-3">
                <button type="submit" class="btn btn-success">Save</button>
                <button type="button" class="btn btn-warning" onclick="location.href='index.html'">Cancel</button>
            </div>
        </form>
    </div>

    
</body>
<script src="./todoform.js"></script>
</html>
